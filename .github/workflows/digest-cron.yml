# Zamanlanmış özet raporu tetikleyicisi. Vercel Hobby cron'u günde bir kez çalışabildiği için
# /api/cron/digest saatte bir buradan çağrılır. GitHub zamanlamayı geciktirebilir; özetin
# 3 saatlik telafi penceresi (DIGEST_GRACE_HOURS) bunu karşılar, DigestLog çift gönderimi önler.
# Gerekenler: repo secret CRON_SECRET (production değeri), repo variable APP_URL
# (production kök adresi, sonda "/" yok). İkisinden biri yoksa iş sessizce atlanır.
name: Digest cron

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/digest
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL ya da CRON_SECRET tanımlı değil — atlanıyor."
            exit 0
          fi
          curl -fsS --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/digest"
